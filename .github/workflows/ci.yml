name: CI

on:
  push:
    branches: [dev-germain, development, main]
  pull_request:
    branches: [development, main]

env:
  NPM_VERSION: '11'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Lint
        run: npm run lint
