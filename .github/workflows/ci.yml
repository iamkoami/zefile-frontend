name: CI

on:
  push:
    branches: [dev-germain, development, main]
  pull_request:
    branches: [development, main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint
