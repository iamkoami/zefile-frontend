name: Deploy to Cloudflare Workers

on:
  push:
    branches: [development, main]

env:
  NPM_VERSION: '11'

jobs:
  deploy-staging:
    name: Deploy Staging
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_TIMEOUT: ${{ secrets.NEXT_PUBLIC_API_TIMEOUT }}
          NEXT_PUBLIC_SHORT_LINK_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHORT_LINK_DOMAIN }}
          NEXT_PUBLIC_SHORT_CODE_PREFIX: ${{ secrets.NEXT_PUBLIC_SHORT_CODE_PREFIX }}
          NEXT_PUBLIC_CDN_DOMAIN: ${{ secrets.NEXT_PUBLIC_CDN_DOMAIN }}
          NEXT_PUBLIC_WASABI_ENDPOINT: ${{ secrets.NEXT_PUBLIC_WASABI_ENDPOINT }}
          NEXT_PUBLIC_CHUNK_SIZE: ${{ secrets.NEXT_PUBLIC_CHUNK_SIZE }}
          NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
          NEXT_PUBLIC_OTP_LENGTH: ${{ secrets.NEXT_PUBLIC_OTP_LENGTH }}
          NEXT_PUBLIC_CAPTCHA_ENABLED: ${{ secrets.NEXT_PUBLIC_CAPTCHA_ENABLED }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS }}
          NEXT_PUBLIC_ENABLE_DEBUG: ${{ secrets.NEXT_PUBLIC_ENABLE_DEBUG }}
          NEXT_PUBLIC_ZEFILE_SUBDOMAIN_BASE: ${{ secrets.NEXT_PUBLIC_ZEFILE_SUBDOMAIN_BASE }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --name zefile-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_TIMEOUT: ${{ secrets.NEXT_PUBLIC_API_TIMEOUT }}
          NEXT_PUBLIC_SHORT_LINK_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHORT_LINK_DOMAIN }}
          NEXT_PUBLIC_SHORT_CODE_PREFIX: ${{ secrets.NEXT_PUBLIC_SHORT_CODE_PREFIX }}
          NEXT_PUBLIC_CDN_DOMAIN: ${{ secrets.NEXT_PUBLIC_CDN_DOMAIN }}
          NEXT_PUBLIC_WASABI_ENDPOINT: ${{ secrets.NEXT_PUBLIC_WASABI_ENDPOINT }}
          NEXT_PUBLIC_CHUNK_SIZE: ${{ secrets.NEXT_PUBLIC_CHUNK_SIZE }}
          NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
          NEXT_PUBLIC_OTP_LENGTH: ${{ secrets.NEXT_PUBLIC_OTP_LENGTH }}
          NEXT_PUBLIC_CAPTCHA_ENABLED: ${{ secrets.NEXT_PUBLIC_CAPTCHA_ENABLED }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS }}
          NEXT_PUBLIC_ENABLE_DEBUG: ${{ secrets.NEXT_PUBLIC_ENABLE_DEBUG }}
          NEXT_PUBLIC_ZEFILE_SUBDOMAIN_BASE: ${{ secrets.NEXT_PUBLIC_ZEFILE_SUBDOMAIN_BASE }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --name zefile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
